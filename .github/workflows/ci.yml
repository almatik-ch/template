name: CI

on:
  pull_request:
  push:
    branches-ignore: [ main, staging ] # main/staging: läuft über deploy.yml vor dem Deploy
  workflow_call:

env:
  RAILS_ENV: test
  DB_HOST: localhost
  POSTGRES_PASSWORD: postgres

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16 # wie config/deploy.yml
        env:
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Unit- und Integrationstests
        run: bin/rails db:test:prepare test

  system-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16 # wie config/deploy.yml
        env:
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Systemtests
        run: bin/rails db:test:prepare test:system
      - name: Screenshots bei Fehlern
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: tmp/screenshots
          if-no-files-found: ignore
